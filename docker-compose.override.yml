version: '3.8'

services:
  nextjs:
    build:
        context: .
        target: development
    image: 'nextjs:latest'
    ports:
      - "3001:3000"  # Expose Next.js app on port 3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - .:/app  # Mount the current directory into the container as /app
    depends_on:
      - mysql
    networks:
      - app_network

  mysql:
    image: mysql:8.0  # MySQL 8.0 image
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"  # Expose MySQL on port 3306
    volumes:
      - mysql-data:/var/lib/mysql  # Persist MySQL data
      - ./mysql:/docker-entrypoint-initdb.d
    networks:
      - app_network

  adminer:
    image: adminer:latest  # Adminer image
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    container_name: adminer
    ports:
      - "8081:8080"  # Expose Adminer on port 8080
    depends_on:
      - mysql  # Ensure MySQL starts before Adminer
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql-data:
    driver: local