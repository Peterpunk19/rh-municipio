services:
  yarn:
    image: 'nextjs:latest'
    init: true
    entrypoint: yarn
    user: root
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - yarn_cache:/home/node/.cache/yarn
    networks:
      - app_network

volumes:
  node_modules:
  yarn_cache:
  data:
  mysql-data:
    driver: local

networks:
  app_network:
    driver: bridge